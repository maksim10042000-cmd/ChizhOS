#
# Конфигурация Nginx для ChizhOS.
#
# Nginx принимает запросы из интернета на порту 80 (и 443 после включения HTTPS)
# и передаёт их приложению, которое слушает порт 3000 только внутри сервера.
#
# Куда положить на сервере:
#   /etc/nginx/sites-available/chizhos
# Затем включить:
#   sudo ln -s /etc/nginx/sites-available/chizhos /etc/nginx/sites-enabled/
#
# ВАЖНО: замените example.com на ваш домен (в двух местах ниже).
# Если домена ещё нет — оставьте вместо него IP-адрес сервера.
#

server {
    # Слушать обычный HTTP-порт.
    listen 80;
    listen [::]:80;

    # Домены, на которые отвечает этот сайт.
    # Без домена укажите здесь IP-адрес сервера или знак _
    server_name example.com www.example.com;

    # Максимальный размер загружаемого файла (документы автомобилей).
    # Должен совпадать с ограничением в приложении — 25 МБ.
    client_max_body_size 25M;

    # Не сообщать версию Nginx в заголовках — меньше информации для злоумышленника.
    server_tokens off;

    # Логи именно этого сайта.
    access_log /var/log/nginx/chizhos-access.log;
    error_log  /var/log/nginx/chizhos-error.log;

    # Сжатие текстовых ответов — страницы открываются быстрее.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Статика Next.js (файлы с уникальными именами) кешируется браузером надолго.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Загруженные документы.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Все остальные запросы — приложению.
    location / {
        # Адрес приложения внутри сервера. 127.0.0.1 = «этот же сервер».
        proxy_pass http://127.0.0.1:3000;

        # Версия протокола для корректной работы постоянных соединений.
        proxy_http_version 1.1;

        # Поддержка веб-сокетов (нужна механизму обновления страниц Next.js).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Передаём приложению настоящий домен и IP посетителя,
        # иначе в логах и редиректах будет 127.0.0.1.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Сообщаем приложению, что снаружи используется https —
        # без этого cookie входа не будет помечена как защищённая.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Ожидание ответа приложения. 60 секунд с запасом на загрузку файлов.
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
